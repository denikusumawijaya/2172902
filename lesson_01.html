<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Tutoring - Garis Bilangan & Bilangan Negatif</title>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- Tailwind CSS (Untuk styling cepat dan responsif) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome (Untuk Icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #46a302;
            --secondary: #1cb0f6;
            --danger: #ff4b4b;
            --warning: #ffc800;
            --bg-color: #f7f7f7;
            --text-main: #3c3c3c;
            --border: #e5e5e5;
        }
        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }
        .katex { font-size: 1.1em; }
        /* Duolingo-like Button */
        .btn-duolingo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            color: white;
        }
        .btn-duolingo:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
        }
        .btn-primary { background-color: var(--primary); border-bottom: 4px solid var(--primary-dark); }
        .btn-secondary { background-color: var(--secondary); border-bottom: 4px solid #0d87c5; }
        .btn-danger { background-color: var(--danger); border-bottom: 4px solid #cc3c3c; }
        .btn-neutral { background-color: #e5e5e5; border-bottom: 4px solid #c5c5c5; color: #777; }
        
        /* Navbar */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 700;
            color: #4b4b4b;
        }
        .nav-item:hover { background: #e5e5e5; }
        .nav-item.active { background: #ddf4ff; color: var(--secondary); }
        .nav-item.completed i.fa-check-circle { color: var(--primary); }

        /* Exercise Styles */
        .option-btn {
            width: 100%;
            text-align: left;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 16px;
            background: white;
            font-weight: 700;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .option-btn:hover { border-color: var(--secondary); background: #f0fdff; }
        .option-btn.selected { border-color: var(--secondary); background: #ddf4ff; color: var(--secondary); }
        .option-btn.correct { border-color: var(--primary); background: #effaE5; color: var(--primary); }
        .option-btn.incorrect { border-color: var(--danger); background: #ffeeee; color: var(--danger); }

        .feedback-box {
            margin-top: 16px;
            padding: 16px;
            border-radius: 16px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Print Styles */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
            @page { size: A4; margin: 10mm; }
        }
    </style>
</head>
<body class="overflow-hidden">

<div class="flex h-screen">
    <!-- Left Navbar -->
    <aside class="w-80 bg-white border-r border-gray-200 flex flex-col overflow-y-auto no-print">
        <div class="p-6 border-b">
            <h1 class="text-xl font-extrabold text-gray-800">MATH TUTORING</h1>
            <p class="text-sm text-gray-500 font-bold">by Deni</p>
        </div>
        <div class="p-4 flex-1">
            <button id="resetAllBtn" class="btn-duolingo btn-danger w-full mb-6 text-sm">
                <i class="fas fa-trash-alt"></i> Reset All Progress
            </button>
            <nav id="sidebarNav" class="space-y-2">
                <!-- Navigation Items Injected by JS -->
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Bar -->
        <header class="bg-white border-b border-gray-200 p-4 flex justify-between items-center no-print">
            <div class="flex items-center gap-4">
                <button id="prevBtn" class="btn-duolingo btn-neutral text-sm">
                    <i class="fas fa-arrow-left"></i> Previous
                </button>
                <h2 id="currentSectionTitle" class="text-lg font-extrabold text-gray-700">Home</h2>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-48 bg-gray-200 rounded-full h-4 overflow-hidden">
                    <div id="progressBar" class="bg-green-500 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <button id="nextBtn" class="btn-duolingo btn-primary text-sm">
                    Next <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div id="contentArea" class="flex-1 overflow-y-auto p-8 bg-gray-50">
            <!-- Konten dirender oleh JS -->
        </div>
    </main>
</div>

<!-- Hidden Print Area -->
<div id="printArea" class="hidden"></div>

<!-- KaTeX JS -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<script>
    // ==========================================
    // GLOBAL STATE & DATA STRUCTURE
    // ==========================================
    const courseData = {
        "home": {
            type: "home",
            title: "Home",
            time: "",
            content: `
                <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm p-8 border border-gray-100">
                    <h2 class="text-3xl font-extrabold text-gray-800 mb-2">MATH TUTORING by Deni</h2>
                    <p class="text-lg text-gray-500 mb-6">Topic: Konsep Garis Bilangan & Bilangan Negatif</p>
                    
                    <div class="bg-blue-50 border-l-4 border-blue-400 p-4 mb-6 rounded-r-lg">
                        <h3 class="font-bold text-blue-700 flex items-center gap-2"><i class="fas fa-info-circle"></i> Aturan Kelas</h3>
                        <ul class="list-decimal list-inside text-blue-600 mt-2 space-y-1">
                            <li>Berbicara secara bergantian</li>
                            <li>Meminta izin jika ingin meninggalkan kelas</li>
                            <li>Menyalakan kamera dan microphone jika diperlukan</li>
                        </ul>
                    </div>

                    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-r-lg">
                        <h3 class="font-bold text-yellow-700 flex items-center gap-2"><i class="fas fa-lightbulb"></i> Tujuan Pembelajaran</h3>
                        <ul class="list-disc list-inside text-yellow-600 mt-2 space-y-1 text-sm">
                            <li>Merepresentasikan posisi bilangan bulat pada garis bilangan.</li>
                            <li>Menganalisis hubungan nilai mutlak dan arah pada konteks suhu & finansial.</li>
                            <li>Mengonstruksi model matematis dari situasi dunia nyata (di bawah nol).</li>
                            <li>Membandingkan besaran dua bilangan bulat.</li>
                        </ul>
                    </div>
                </div>
            `
        },
        "sec1": {
            type: "section",
            title: "Spiral Review Warm-up",
            time: "00:00-00:10",
            steps: [
                {
                    type: "theory",
                    content: `
                        <h3 class="text-2xl font-extrabold text-gray-800 mb-4">Logika Dasar & Titik Referensi</h3>
                        <p class="text-gray-600 mb-4">Sebelum memasuki dunia bilangan negatif, mari kita asah logika berpikir kritis. Dalam matematika, kita sering menggunakan simbol seperti \( > \) (lebih dari) dan \( < \) (kurang dari).</p>
                        <div class="bg-green-50 p-4 rounded-xl border border-green-200 mb-4">
                            <p class="font-bold text-green-700">Contoh:</p>
                            <p class="text-green-600">Jika \( A > B \) dan \( B > C \), maka secara berurutan nilainya adalah \( A \), \( B \), \( C \). Artinya, \( C \) adalah yang terkecil.</p>
                        </div>
                        <p class="text-gray-600">Kita juga harus paham konsep <b>titik nol (referensi)</b>. Jika kamu naik 5 lantai lalu turun 5 lantai, kamu akan kembali ke titik awal. Hari ini, "titik awal" ini adalah kunci untuk memahami angka di bawah nol.</p>
                    `
                },
                {
                    type: "exercise",
                    question: "Jika \( X > Y \) dan \( Y > Z \), manakah pernyataan yang pasti benar?",
                    options: [
                        "X adalah yang terkecil",
                        "Z adalah yang terkecil",
                        "Y adalah yang terbesar",
                        "X dan Z memiliki nilai yang sama"
                    ],
                    correct: 1,
                    explanation: "Karena \( X > Y \) dan \( Y > Z \), urutannya dari terbesar ke terkecil adalah \( X \), \( Y \), \( Z \). Jadi, \( Z \) pasti yang terkecil."
                },
                {
                    type: "exercise",
                    question: "Jika kamu berada di lantai 3, lalu turun 3 lantai, di mana posisimu sekarang dibandingkan titik awal (lantai dasar)?",
                    options: [
                        "Masih di lantai 3",
                        "Di lantai dasar (titik 0)",
                        "Di lantai 6",
                        "Tidak bisa ditentukan"
                    ],
                    correct: 1,
                    explanation: "Turun 3 lantai dari lantai 3 berarti 3 - 3 = 0. Kamu berada tepat di titik referensi (lantai dasar)."
                },
                {
                    type: "exercise",
                    question: "Manakah yang lebih jauh dari angka 0?",
                    options: [
                        "Angka 5",
                        "Angka 8",
                        "Keduanya sama jauhnya",
                        "Tidak bisa dibandingkan"
                    ],
                    correct: 1,
                    explanation: "Jarak angka 5 ke 0 adalah 5 satuan. Jarak angka 8 ke 0 adalah 8 satuan. Karena 8 > 5, maka angka 8 lebih jauh dari 0."
                },
                {
                    type: "theory",
                    content: `
                        <h3 class="text-2xl font-extrabold text-gray-800 mb-4">Konsep Selisih dan Pergeseran</h3>
                        <p class="text-gray-600 mb-4">Selisih adalah jarak antara dua bilangan. Untuk mencari selisih, kita gunakan operasi pengurangan.</p>
                        <div class="bg-blue-50 p-4 rounded-xl border border-blue-200">
                            <p class="font-bold text-blue-700">Rumus Cepat:</p>
                            <p class="text-blue-600">Selisih = Nilai Terbesar - Nilai Terkecil</p>
                        </div>
                        <p class="text-gray-600 mt-4">Dalam garis bilangan, pergerakan ke kanan berarti <b>bertambah</b> (positif), sedangkan pergerakan ke kiri berarti <b>berkurang</b>. Pemahaman ini akan sangat berguna saat kita memasuki angka negatif nanti.</p>
                    `
                },
                {
                    type: "exercise",
                    question: "Berapakah selisih antara 150 dan 75?",
                    options: ["75", "125", "225", "50"],
                    correct: 0,
                    explanation: "Selisih = 150 - 75 = 75. Jarak antara 75 dan 150 pada garis bilangan adalah 75 satuan."
                },
                {
                    type: "exercise",
                    question: "Pada sebuah garis bilangan, jika kamu bergerak 7 satuan ke kanan dari titik 4, di mana kamu berhenti?",
                    options: ["Titik 10", "Titik 11", "Titik 3", "Titik 12"],
                    correct: 1,
                    explanation: "Gerak ke kanan berarti menjumlahkan: 4 + 7 = 11."
                },
                {
                    type: "exercise",
                    question: "Jika A = 20 dan B = 35. Bagaimana hubungan antara A dan B?",
                    options: [
                        "A > B",
                        "A < B",
                        "A = B",
                        "A + B = 0"
                    ],
                    correct: 1,
                    explanation: "Karena 20 berada di sebelah kiri 35 pada garis bilangan standar, maka 20 kurang dari 35 (A < B)."
                },
                {
                    type: "theory",
                    content: `
                        <h3 class="text-2xl font-extrabold text-gray-800 mb-4">Mempersiapkan Dunia Bawah Nol</h3>
                        <p class="text-gray-600 mb-4">Selama ini kita bermain dengan bilangan bulat positif (1, 2, 3, ...). Namun, di dunia nyata, kita sering menjumpai kondisi di mana nilai kita "habis" atau bahkan "berkurang dari titik nol".</p>
                        <div class="flex justify-center my-6">
                            <svg width="300" height="100" viewBox="0 0 300 100">
                                <line x1="20" y1="50" x2="280" y2="50" stroke="#4b4b4b" stroke-width="2" />
                                <polygon points="280,50 270,45 270,55" fill="#4b4b4b" />
                                <circle cx="150" cy="50" r="4" fill="#1cb0f6" />
                                <text x="145" y="75" font-size="14" font-weight="bold" fill="#1cb0f6">0</text>
                                <circle cx="220" cy="50" r="4" fill="#58cc02" />
                                <text x="210" y="75" font-size="14" font-weight="bold" fill="#58cc02">Positif</text>
                                <circle cx="80" cy="50" r="4" fill="#ff4b4b" />
                                <text x="70" y="75" font-size="14" font-weight="bold" fill="#ff4b4b">Negatif?</text>
                            </svg>
                        </div>
                        <p class="text-gray-600">Bayangkan sebuah garis yang memanjang ke kanan (positif). Apa yang terjadi jika kita terus bergerak ke kiri melewati angka 0? Di situlah letak dunia bilangan negatif!</p>
                    `
                },
                {
                    type: "exercise",
                    question: "Kamu memiliki uang Rp 0. Lalu kamu meminjam uang Rp 10.000. Secara matematis, bagaimana kondisi kekayaanmu sekarang dibandingkan titik 0?",
                    options: [
                        "Tetap di 0",
                        "Lebih dari 0",
                        "Kurang dari 0 (Di bawah nol)",
                        "Tidak terdefinisi"
                    ],
                    correct: 2,
                    explanation: "Karena kamu berhutang, kondisinya lebih buruk daripada tidak punya apa-apa (titik 0). Jadi posisimu berada di bawah nol."
                },
                {
                    type: "exercise",
                    question: "Jika suhu ruangan adalah 5°C dan menurun 10°C, suhu akhir ruangan tersebut adalah...",
                    options: [
                        "5°C",
                        "15°C",
                        "0°C",
                        "Di bawah 0°C"
                    ],
                    correct: 3,
                    explanation: "Jika dari 5°C turun 5°C, kita mencapai 0°C. Karena turunnya 10°C, berarti melewati titik 0 dan masuk ke wilayah di bawah nol (negatif)."
                },
                {
                    type: "exercise",
                    question: "Manakah simbol matematika yang umum digunakan untuk menunjukkan nilai di bawah nol (misal: 5 derajat di bawah nol)?",
                    options: [
                        "+5",
                        "x5",
                        "-5",
                        "/5"
                    ],
                    correct: 2,
                    explanation: "Tanda minus (-) digunakan untuk merepresentasikan nilai yang berada di bawah titik referensi (nol). Jadi, 5 derajat di bawah nol ditulis -5."
                },
                {
                    type: "exercise",
                    question: "Siapakah yang menemukan sistem bilangan negatif secara formal dalam sejarah matematika (sering dikaitkan dengan matematikawan Tiongkok kuno)?",
                    options: [
                        "Al-Khawarizmi",
                        "Euclid",
                        "Pythagoras",
                        "Liu Hui"
                    ],
                    correct: 3,
                    explanation: "Meskipun banyak budaya mengenal konsep utang, Liu Hui (matematikawan Tiongkok abad ke-3) secara formal menetapkan aturan penjumlahan dan pengurangan bilangan negatif pada sistem bilangan."
                }
            ]
        }
    };

    // ==========================================
    // JAVASCRIPT ENGINE
    // ==========================================
    let currentSection = "home";
    let currentStepIndex = 0;
    let userProgress = {}; // Menyimpan status selesai & jawaban user

    // Fungsi untuk mengacak array (opsi jawaban)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Render Sidebar Navigation
    function renderSidebar() {
        const nav = document.getElementById('sidebarNav');
        nav.innerHTML = '';
        
        for (let key in courseData) {
            const section = courseData[key];
            const div = document.createElement('div');
            div.className = 'nav-item';
            div.dataset.section = key;
            
            let icon = 'fa-home';
            if(section.type === 'section') icon = 'fa-book-open';
            if(section.type === 'assignment') icon = 'fa-pen-to-square';
            if(section.type === 'final') icon = 'fa-flag-checkered';

            if (key === currentSection) div.classList.add('active');
            
            div.innerHTML = `
                <i class="fas ${icon} w-5 text-center"></i>
                <div class="flex-1">
                    <div>${section.title}</div>
                    ${section.time ? `<div class="text-xs text-gray-400 font-normal">${section.time}</div>` : ''}
                </div>
                <i class="fas fa-check-circle ${userProgress[key + '_done'] ? 'text-green-500' : 'text-gray-300'}"></i>
            `;
            
            div.onclick = () => loadSection(key);
            nav.appendChild(div);
        }
    }

    // Load Section
    function loadSection(sectionKey) {
        currentSection = sectionKey;
        currentStepIndex = 0;
        renderSidebar();
        renderContent();
    }

    // Render Content based on step
    function renderContent() {
        const area = document.getElementById('contentArea');
        const section = courseData[currentSection];
        document.getElementById('currentSectionTitle').innerText = section.title;

        if (section.type === "home" || section.type === "final") {
            area.innerHTML = section.content;
            updateNavButtons(false);
        } else {
            // Section with steps (Theory & Exercises)
            const step = section.steps[currentStepIndex];
            renderStep(step);
            updateProgress();
        }
    }

    // Render Step (Theory or Exercise)
    function renderStep(step) {
        const area = document.getElementById('contentArea');
        const section = courseData[currentSection];
        const totalSteps = section.steps.length;
        const progress = ((currentStepIndex + 1) / totalSteps) * 100;
        document.getElementById('progressBar').style.width = progress + '%';

        if (step.type === 'theory') {
            area.innerHTML = `
                <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm p-8 border border-gray-100 animate-fadeIn">
                    ${step.content}
                </div>
            `;
            updateNavButtons(true);
        } else if (step.type === 'exercise') {
            // Acak opsi
            const optionsWithIndex = step.options.map((opt, idx) => ({text: opt, originalIdx: idx}));
            const shuffledOptions = shuffleArray(optionsWithIndex);
            
            let optionsHtml = shuffledOptions.map((opt, idx) => `
                <button class="option-btn" onclick="selectAnswer(this, ${opt.originalIdx})" data-orig-idx="${opt.originalIdx}">
                    <span class="w-8 h-8 border-2 border-gray-300 rounded-full flex items-center justify-center font-bold text-gray-500">
                        ${String.fromCharCode(65 + idx)}
                    </span>
                    <span class="flex-1">${opt.text}</span>
                </button>
            `).join('');

            let assignmentPrintBtn = '';
            if (section.type === 'assignment') {
                assignmentPrintBtn = `
                    <button class="btn-duolingo btn-secondary w-full mt-6 no-print" onclick="printAssignmentResult()">
                        <i class="fas fa-print"></i> Print Result
                    </button>
                `;
            }

            area.innerHTML = `
                <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm p-8 border border-gray-100 animate-fadeIn">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-sm font-bold text-gray-400 uppercase">Latihan Soal</span>
                        <span class="text-sm font-bold text-blue-500">${currentStepIndex + 1} / ${totalSteps}</span>
                    </div>
                    <h3 class="text-xl font-extrabold text-gray-800 mb-6">${step.question}</h3>
                    <div class="space-y-3 mb-6">
                        ${optionsHtml}
                    </div>
                    <button id="resetQuestionBtn" class="btn-duolingo btn-neutral text-sm w-full mt-4 no-print" onclick="resetCurrentQuestion()">
                        <i class="fas fa-redo"></i> Reset Jawaban
                    </button>
                    <div id="feedbackArea" class="feedback-box"></div>
                    ${assignmentPrintBtn}
                </div>
            `;
            updateNavButtons(false); // Disable next sampai dijawab
        }
    }

    // Handle Answer Selection
    function selectAnswer(btn, originalIdx) {
        const step = courseData[currentSection].steps[currentStepIndex];
        const isCorrect = originalIdx === step.correct;
        const allBtns = document.querySelectorAll('.option-btn');
        
        allBtns.forEach(b => b.disabled = true);
        btn.classList.add('selected');

        // Tampilkan jawaban benar jika salah
        if (!isCorrect) {
            allBtns.forEach(b => {
                if (parseInt(b.dataset.origIdx) === step.correct) {
                    b.classList.add('correct');
                }
            });
            btn.classList.add('incorrect');
        } else {
            btn.classList.add('correct');
        }

        const feedback = document.getElementById('feedbackArea');
        feedback.style.display = 'block';
        if (isCorrect) {
            feedback.className = 'feedback-box bg-green-50 border-2 border-green-200 text-green-700';
            feedback.innerHTML = `<p class="font-bold mb-2 flex items-center gap-2"><i class="fas fa-check-circle"></i> Jawaban Benar!</p><p class="text-sm">${step.explanation}</p>`;
        } else {
            feedback.className = 'feedback-box bg-red-50 border-2 border-red-200 text-red-700';
            feedback.innerHTML = `<p class="font-bold mb-2 flex items-center gap-2"><i class="fas fa-times-circle"></i> Jawaban Kurang Tepat.</p><p class="text-sm"><b>Penjelasan:</b> ${step.explanation}</p>`;
        }

        // Catat jawaban jika di assignment
        const section = courseData[currentSection];
        if (section.type === 'assignment') {
            assignmentAnswers[currentStepIndex] = originalIdx;
        }

        updateNavButtons(true); // Aktifkan tombol next
    }

    // Reset Current Question
    function resetCurrentQuestion() {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => {
            b.disabled = false;
            b.classList.remove('selected', 'correct', 'incorrect');
        });
        const feedback = document.getElementById('feedbackArea');
        if(feedback) {
            feedback.style.display = 'none';
            feedback.innerHTML = '';
        }
        updateNavButtons(false); // Nonaktifkan tombol next lagi
    }

    // Nav Buttons Logic
    function updateNavButtons(isStepInteractive) {
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const section = courseData[currentSection];

        // Previous Button Logic
        prevBtn.classList.remove('opacity-50', 'pointer-events-none');
        prevBtn.onclick = () => goPrev();
        
        if (section.type === 'home') {
            prevBtn.classList.add('opacity-50', 'pointer-events-none');
        }

        // Next Button Logic
        nextBtn.classList.remove('opacity-50', 'pointer-events-none');
        
        if (section.type === 'final') {
            nextBtn.innerHTML = '<i class="fas fa-external-link-alt"></i> Ke Algonova';
            nextBtn.onclick = () => window.open('https://learn.algonova.id/login', '_blank');
        } else {
            nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right"></i>';
            nextBtn.onclick = () => goNext();
        }
    }

    // Next Logic
    function goNext() {
        const section = courseData[currentSection];
        if (section.type === 'home' || section.type === 'final') {
            // Ke section selanjutnya di data object
            const keys = Object.keys(courseData);
            let currentIdx = keys.indexOf(currentSection);
            if (currentIdx < keys.length - 1) {
                loadSection(keys[currentIdx + 1]);
            }
        } else {
            // Step by step
            if (currentStepIndex < section.steps.length - 1) {
                currentStepIndex++;
                renderContent();
            } else {
                // Selesai dengan section ini, pindah ke section selanjutnya
                userProgress[currentSection + '_done'] = true;
                renderSidebar(); // update checkmark
                const keys = Object.keys(courseData);
                let currentIdx = keys.indexOf(currentSection);
                if (currentIdx < keys.length - 1) {
                    loadSection(keys[currentIdx + 1]);
                }
            }
        }
    }

    // Previous Logic
    function goPrev() {
        const section = courseData[currentSection];
        if (section.type === 'home') return;

        if (section.type === 'section' || section.type === 'assignment') {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                renderContent();
                return;
            }
        }
        
        // Kembali ke section sebelumnya
        const keys = Object.keys(courseData);
        let currentIdx = keys.indexOf(currentSection);
        if (currentIdx > 0) {
            let prevKey = keys[currentIdx - 1];
            let prevSection = courseData[prevKey];
            
            // Jika section sebelumnya punya steps, arahkan ke step terakhir
            if (prevSection.steps && prevSection.steps.length > 0) {
                currentSection = prevKey;
                currentStepIndex = prevSection.steps.length - 1;
                renderSidebar();
                renderContent();
            } else {
                loadSection(prevKey);
            }
        }
    }

    function updateProgress() {
        // Dummy logic for progress bar
        const section = courseData[currentSection];
        if(section.steps) {
            const progress = ((currentStepIndex + 1) / section.steps.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        } else {
            document.getElementById('progressBar').style.width = '100%';
        }
    }

    // ==========================================
    // ASSIGNMENT DATA RECORDING
    // ==========================================
    let assignmentAnswers = {};

    // Fungsi Print Hasil (Format A4)
    function printAssignmentResult() {
        const section = courseData[currentSection];
        let score = 0;
        let tableRows = '';
        
        for (let i = 0; i < section.steps.length; i++) {
            const step = section.steps[i];
            const studentAnsIdx = assignmentAnswers[i];
            const isCorrect = studentAnsIdx === step.correct;
            if (isCorrect) score++;
            
            // Ekstrak teks jawaban (hapus tag HTML/KaTeX delimiter untuk print sederhana)
            const stripHtml = (html) => {
                let tmp = document.createElement("DIV");
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || "";
            };

            const studentAnsText = studentAnsIdx !== undefined ? stripHtml(step.options[studentAnsIdx]) : 'Tidak Dijawab';
            const correctAnsText = stripHtml(step.options[step.correct]);
            const noteIcon = isCorrect ? '✔️' : '❌';
            
            tableRows += `
                <tr>
                    <td style="border: 1px solid #ddd; padding: 6px; text-align: center;">${i+1}</td>
                    <td style="border: 1px solid #ddd; padding: 6px;">${stripHtml(step.question)}</td>
                    <td style="border: 1px solid #ddd; padding: 6px;">${studentAnsText}</td>
                    <td style="border: 1px solid #ddd; padding: 6px;">${correctAnsText}</td>
                    <td style="border: 1px solid #ddd; padding: 6px; text-align: center; font-size: 14px;">${noteIcon}</td>
                </tr>
            `;
        }
        
        const printContent = `
            <div style="font-family: Arial, sans-serif; color: #000; padding: 20px; width: 100%; box-sizing: border-box;">
                <h2 style="text-align: center; margin: 0 0 10px 0;">MATH TUTORING by Deni</h2>
                <hr style="border: 1px solid #000; margin-bottom: 20px;">
                <table style="width: 100%; font-size: 14px; margin-bottom: 20px;">
                    <tr>
                        <td><strong>Name:</strong> ........................................</td>
                        <td><strong>Date:</strong> ........................................</td>
                    </tr>
                    <tr>
                        <td><strong>Topic:</strong> Konsep Garis Bilangan & Bilangan Negatif</td>
                        <td><strong>Assignment Group:</strong> ${section.title}</td>
                    </tr>
                    <tr>
                        <td colspan="2"><strong>Score:</strong> ${score} / 10</td>
                    </tr>
                </table>
                <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                    <thead>
                        <tr style="background: #eee;">
                            <th style="border: 1px solid #ddd; padding: 6px; width: 5%;">No.</th>
                            <th style="border: 1px solid #ddd; padding: 6px; width: 45%;">Question</th>
                            <th style="border: 1px solid #ddd; padding: 6px; width: 20%;">Student Answer</th>
                            <th style="border: 1px solid #ddd; padding: 6px; width: 20%;">Correct Answer</th>
                            <th style="border: 1px solid #ddd; padding: 6px; width: 10%;">Note</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
                <div style="margin-top: 40px; text-align: right; font-size: 14px;">
                    <p>Checked by,</p>
                    <br><br>
                    <p><strong>Deni</strong></p>
                </div>
            </div>
        `;
        
        const printArea = document.getElementById('printArea');
        printArea.innerHTML = printContent;
        printArea.classList.remove('hidden');
        
        // Render KaTeX untuk area print
        if (typeof renderMathInElement !== 'undefined') {
            renderMathInElement(printArea, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '\\(', right: '\\)', display: false}
                ]
            });
        }
        
        window.print();
        setTimeout(() => {
            printArea.classList.add('hidden');
            printArea.innerHTML = '';
        }, 500);
    }

    // ==========================================
    // FINAL RENDER CALLS
    // ==========================================
    renderSidebar();
    loadSection("home");
</script>
