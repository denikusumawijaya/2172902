        function getFlatIndex(secIdx, stepIdx) {
            return `${secIdx}-${stepIdx}`;
        }

        function renderNav() {
            const navList = document.getElementById('nav-list');
            navList.innerHTML = '';
            LESSON_DATA.forEach((sec, sIdx) => {
                const isInfo = sec.type === 'info';
                const li = document.createElement('li');
                li.className = `nav-item cursor-pointer p-2 rounded flex items-center gap-2 ${currentSectionIndex === sIdx ? 'active' : ''}`;
                li.onclick = () => {
                    currentSectionIndex = sIdx;
                    currentStepIndex = 0;
                    renderContent();
                    renderNav();
                };
                
                let statusIcon = `<i class="fas ${sec.icon || 'fa-book'} text-gray-400 w-5 text-center"></i>`;
                if(!isInfo) {
                    const stepsCompleted = sec.steps.filter((_, stIdx) => userProgress[getFlatIndex(sIdx, stIdx)]).length;
                    if(stepsCompleted === sec.steps.length) statusIcon = `<i class="fas fa-check-circle text-green-500 w-5 text-center"></i>`;
                    else if(stepsCompleted > 0) statusIcon = `<i class="fas fa-play-circle text-indigo-400 w-5 text-center"></i>`;
                }

                li.innerHTML = `${statusIcon} <span class="flex-1 truncate">${sec.title}</span> ${!isInfo ? `<span class="text-xs text-gray-400">${sec.time || ''}</span>` : ''}`;
                navList.appendChild(li);
            });
        }

        function navigate(dir) {
            const sec = LESSON_DATA[currentSectionIndex];
            const isInfo = sec.type === 'info';
            const maxStep = isInfo ? 0 : sec.steps.length - 1;

            currentStepIndex += dir;

            if(currentStepIndex > maxStep) {
                currentSectionIndex++;
                currentStepIndex = 0;
                if(currentSectionIndex >= LESSON_DATA.length) {
                    currentSectionIndex = LESSON_DATA.length - 1;
                    currentStepIndex = maxStep;
                }
            } else if(currentStepIndex < 0) {
                currentSectionIndex--;
                if(currentSectionIndex < 0) {
                    currentSectionIndex = 0;
                    currentStepIndex = 0;
                } else {
                    const prevSec = LESSON_DATA[currentSectionIndex];
                    currentStepIndex = prevSec.type === 'info' ? 0 : prevSec.steps.length - 1;
                }
            }
            renderContent();
            renderNav();
        }

                        if(isAnswered) {
                            if(isCorrect) borderClass = 'correct-bg border-green-400';
                            if(isSelectedWrong) borderClass = 'wrong-bg border-red-400';
                        }

                        optionsHtml += `
                            <button onclick="selectOption('${flatIdx}', ${idx})" 
                                    class="w-full p-3 border rounded-lg text-left transition flex items-center gap-3 ${borderClass} ${isAnswered ? 'pointer-events-none' : ''}" 
                                    ${isAnswered ? 'disabled' : ''}>
                                <span class="flex-1">${opt}</span>
                                ${isAnswered && isCorrect ? '<i class="fas fa-check-circle text-green-500"></i>' : ''}
                                ${isSelectedWrong ? '<i class="fas fa-times-circle text-red-500"></i>' : ''}
                            </button>
                        `;
                    });

                    // Inject Print Button for Assignments (Always visible)
                    let printBtnHtml = '';
                    if(sec.id.includes('assign')) {
                        printBtnHtml = `
                            <div class="mt-6 text-right">
                                <button onclick="printAssignment('${sec.id}')" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition inline-flex items-center gap-2 text-sm border border-gray-300">
                                    <i class="fas fa-print"></i> Cetak Hasil Assignment
                                </button>
                            </div>
                        `;
                    }

                    // Inject Reset Button if already answered
                    let resetBtnHtml = '';
                    if(isAnswered) {
                        resetBtnHtml = `
                            <div class="mt-4 text-right">
                                <button onclick="resetStep('${flatIdx}')" class="text-red-500 hover:text-red-700 text-sm font-medium transition inline-flex items-center gap-1">
                                    <i class="fas fa-undo-alt"></i> Ulangi Jawaban
                                </button>
                            </div>
                        `;
                    }

                    html = `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 fade-in">
                            <div class="flex items-center gap-3 mb-4 text-yellow-600">
                                <i class="fas fa-brain text-2xl"></i>
                                <h3 class="text-lg font-bold">Latihan Soal (TKA Style)</h3>
                            </div>
                            <p class="text-gray-800 font-medium mb-6">${step.q}</p>
                            <div class="space-y-3" id="options-${flatIdx}">
                                ${optionsHtml}
                            </div>
                            
                            ${isAnswered ? `
                            <div class="mt-6 bg-blue-50 p-4 rounded-lg border border-blue-100">
                                <button onclick="document.getElementById('exp-${flatIdx}').classList.toggle('hidden')" class="text-blue-600 font-bold flex items-center gap-2 mb-2">
                                    <i class="fas fa-info-circle"></i> Lihat Pembahasan
                                </button>
                                <div id="exp-${flatIdx}" class="hidden text-blue-800 text-sm mt-2 leading-relaxed">
                                    ${parseSimpleMarkdown(step.explanation)}
                                </div>
                            </div>` : ''}
                            
                            ${resetBtnHtml}
                            ${printBtnHtml}
                        </div>
                    `;
                } else if(step.type === 'assignment-group') {
                    renderAssignmentGroup(step, container, sec);
                    updateNavButtons();
                    return;
                }
            }

            container.innerHTML = html;
            // Re-render KaTeX
            renderMathInElement(container, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });
            updateNavButtons();
        }

        function checkAnswer(flatIdx, isCorrect, selectedOpt) {
            userProgress[flatIdx] = selectedOpt;
            saveProgress();
            renderContent();
            renderNav();
        }

        function selectOption(flatIdx, optIndex) {
            const [secIdx, stepIdx] = flatIdx.split('-').map(Number);
            const step = LESSON_DATA[secIdx].steps[stepIdx];
            const opt = step.shuffledOptions[optIndex];
            const isCorrect = opt === step.correct;
            checkAnswer(flatIdx, isCorrect, opt);
        }

        function updateProgress(percent) {
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function updateNavButtons() {
            const sec = LESSON_DATA[currentSectionIndex];
            const isInfo = sec.type === 'info';
            const maxStep = isInfo ? 0 : sec.steps.length - 1;

            document.getElementById('btn-prev').disabled = (currentSectionIndex === 0 && currentStepIndex === 0);
            document.getElementById('btn-next').disabled = (currentSectionIndex === LESSON_DATA.length - 1 && currentStepIndex === maxStep);
        }

        // --- ASSIGNMENT & PRINT LOGIC ---
        function renderAssignmentGroup(step, container, sec) {
            container.innerHTML = `<div class="text-center p-10"><i class="fas fa-spinner fa-spin text-3xl text-indigo-500"></i><p class="mt-2">Memuat Assignment...</p></div>`;
        }

        function printAssignment(secId) {
            const secIndex = LESSON_DATA.findIndex(s => s.id === secId);
            const sec = LESSON_DATA[secIndex];
            if(!sec) return;

            let score = 0;
            const totalQ = sec.steps.length;
            let tableRows = "";

            sec.steps.forEach((step, idx) => {
                const flatIdx = getFlatIndex(secIndex, idx);
                const userAns = userProgress[flatIdx] || "-";
                const isCorrect = userAns === step.correct;
                if(isCorrect) score++;
                const note = isCorrect ? "✔️" : "❌";
                
                // Bersihkan enter/spasi berlebih agar tidak turun ke bawah di tabel
                const cleanQ = step.q.replace(/\n/g, ' ').replace(/\s+/g, ' ');
                const cleanUserAns = userAns.replace(/\n/g, ' ').replace(/\s+/g, ' ');
                const cleanCorrect = step.correct.replace(/\n/g, ' ').replace(/\s+/g, ' ');

                tableRows += `<tr><td>${idx+1}</td><td>${cleanQ}</td><td>${cleanUserAns}</td><td>${cleanCorrect}</td><td style="text-align:center">${note}</td></tr>`;
            });

            const tableHtml = `
                <table style="width:100%; border-collapse:collapse; font-size: 9pt;">
                    <thead>
                        <tr style="background:#f3f4f6;">
                            <th style="border:1px solid #000; width:5%;">No.</th>
                            <th style="border:1px solid #000; width:40%;">Question</th>
                            <th style="border:1px solid #000; width:20%;">Student Answer</th>
                            <th style="border:1px solid #000; width:20%;">Correct Answer</th>
                            <th style="border:1px solid #000; width:10%;">Note</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
            `;

            const printContentTemplate = `
                <div style="font-family: sans-serif; max-width: 800px; margin: auto;">
                    <h2 style="text-align:center; margin-bottom: 5px;">MATH TUTORING by Deni</h2>
                    <hr style="border: 1px solid #000;">
                    <table style="width:100%; border:none; margin-top:10px;">
                        <tr><td><b>Name</b>:</td><td>............................</td><td><b>Date</b>:</td><td>............................</td></tr>
                        <tr><td><b>Topic</b>:</td><td>Operasi Bilangan Rasional</td><td><b>Assignment Group</b>:</td><td>${sec.title}</td></tr>
                        <tr><td><b>Score</b>:</td><td colspan="3"><b>${score} / ${totalQ}</b></td></tr>
                    </table>
                    <br>
                    {{TABLE_CONTENT}}
                    <br><br>
                    <div style="text-align:right; margin-right:50px;">
                        <p>Checked by,</p>
                        <br><br>
                        <p><b>Deni</b></p>
                    </div>
                </div>
            `;

            // 1. Buat div sementara tersembunyi di halaman utama
            const tempDiv = document.createElement('div');
            tempDiv.style.position = 'absolute';
            tempDiv.style.left = '-9999px';
            tempDiv.style.visibility = 'hidden';
            document.body.appendChild(tempDiv);

            // 2. Masukkan HTML ke div tersebut, lalu suruh KaTeX halaman utama merender-nya
            tempDiv.innerHTML = printContentTemplate.replace('{{TABLE_CONTENT}}', tableHtml);
            renderMathInElement(tempDiv, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });

            // 3. Tunggu sebentar hingga rendering selesai, lalu kirim ke tab baru
            setTimeout(() => {
                const renderedHtml = tempDiv.innerHTML; // Ambil HTML yang sudah jadi (bukan mentah)
                document.body.removeChild(tempDiv); // Bersihkan div sementara

                const printWindow = window.open('', '_blank', 'width=800,height=600');
                printWindow.document.write('<html><head><title>Print Assignment</title>');
                // Kita HANYA butuh CSS KaTeX, tidak perlu JS lagi!
                printWindow.document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">');
                printWindow.document.write('<style>body{margin:20px;} @page{size:A4; margin:10mm;} table{word-wrap:break-word;} th,td{padding:4px;}</style>');
                printWindow.document.write('</head><body>');
                printWindow.document.write(renderedHtml);
                printWindow.document.write('</body></html>');
                printWindow.document.close();
                
                // Cetak setelah CSS selesai dimuat
                printWindow.onload = function() {
                    printWindow.print();
                };
            }, 300); // Delay 300ms untuk memastikan KaTeX selesai merender span
        }

        // --- INIT ---
        window.onload = () => {
            renderNav();
            renderContent();
        };
    </script>
</body>
</html>
